name: CI

# En main no se dispara por push: ahí lo llama deploy-mobile.yml como puerta previa a publicar.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finanzas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finanzas_test?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar dominio y generar cliente de Prisma
        run: |
          pnpm --filter @finanzas/domain build
          pnpm --filter @finanzas/api exec prisma generate
      - name: Typecheck
        run: |
          pnpm --filter @finanzas/ui typecheck
          pnpm --filter @finanzas/mobile typecheck
          pnpm --filter @finanzas/api exec tsc --noEmit
          pnpm --filter @finanzas/web exec tsc --noEmit
      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level high
      - name: Migraciones de la BD de pruebas
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy
      - name: Pruebas
        run: pnpm -r --workspace-concurrency=1 test
      # Puerta contra una política de seguridad (CSP) rota: el service worker reemplaza la
      # versión buena en el celular al abrir, así que se prueba en un navegador real antes de publicar.
      - name: Navegador para pruebas e2e
        run: pnpm --filter @finanzas/mobile exec playwright install --with-deps chromium
      - name: Prueba en navegador (CSP y uso sin internet)
        run: pnpm --filter @finanzas/mobile e2e
